<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>منصة الغيث التعليمية</title>

<style>

/* =========================================================
   منصة الغيث التعليمية
   التصميم الرئيسي
   ========================================================= */

:root{
    --green:#063b30;
    --green2:#0a5141;
    --green3:#082d25;
    --gold:#d6a83e;
    --gold2:#f0c967;
    --cream:#f7f4ec;
    --white:#ffffff;
    --text:#12352e;
    --muted:#687a74;
    --border:#e7e5dd;
    --shadow:0 12px 35px rgba(0,0,0,.10);
    --radius:22px;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
        Tahoma,
        Arial,
        "Noto Sans Arabic",
        sans-serif;
    background:#f7f7f4;
    color:var(--text);
    overflow-x:hidden;
}

button,
a{
    font-family:inherit;
}

a{
    text-decoration:none;
    color:inherit;
}

button{
    cursor:pointer;
}

/* =========================================================
   شريط الوزارة العلوي
   ========================================================= */

.topbar{
    min-height:45px;
    background:
        linear-gradient(
            90deg,
            #052c24,
            #0b4739,
            #052c24
        );
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 4%;
    font-size:13px;
}

.ministry{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:bold;
}

.iraq-flag{
    width:27px;
    height:18px;
    border-radius:3px;
    overflow:hidden;
    display:inline-flex;
    flex-direction:column;
    box-shadow:0 1px 4px rgba(0,0,0,.3);
}

.iraq-flag span{
    flex:1;
}

.iraq-flag .r{background:#ce2027}
.iraq-flag .w{
    background:#fff;
    position:relative;
}
.iraq-flag .w:after{
    content:"الله أكبر";
    color:#08753d;
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    font-size:5px;
    font-weight:bold;
}
.iraq-flag .b{background:#111}

.motto{
    color:var(--gold2);
    font-weight:bold;
    letter-spacing:.5px;
}

.login-top{
    border:1px solid rgba(255,255,255,.7);
    border-radius:30px;
    padding:7px 17px;
    color:white;
    background:transparent;
    transition:.3s;
}

.login-top:hover{
    background:var(--gold);
    color:#123;
    border-color:var(--gold);
}

/* =========================================================
   شريط التنقل
   ========================================================= */

.navbar{
    background:#fff;
    min-height:76px;
    padding:0 4%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    box-shadow:0 3px 14px rgba(0,0,0,.06);
    position:relative;
    z-index:50;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brand-logo{
    width:58px;
    height:58px;
    position:relative;
    display:grid;
    place-items:center;
}

.brand-logo .g{
    font-size:47px;
    line-height:1;
    font-weight:900;
    color:var(--green);
    font-family:Georgia,serif;
}

.brand-logo .leaf{
    position:absolute;
    right:3px;
    bottom:5px;
    width:19px;
    height:30px;
    background:var(--gold);
    border-radius:100% 0 100% 0;
    transform:rotate(-25deg);
}

.brand-text strong{
    display:block;
    color:var(--green);
    font-size:18px;
}

.brand-text small{
    color:#7c8985;
    font-size:11px;
}

.nav-links{
    display:flex;
    align-items:center;
    gap:7px;
}

.nav-link{
    padding:12px 15px;
    border-radius:13px;
    font-size:14px;
    font-weight:bold;
    transition:.3s;
    white-space:nowrap;
}

.nav-link:hover,
.nav-link.active{
    background:var(--green);
    color:#fff;
    box-shadow:0 5px 15px rgba(6,59,48,.20);
}

.nav-icon{
    margin-left:5px;
}

.menu-btn{
    display:none;
    border:0;
    background:var(--green);
    color:#fff;
    border-radius:10px;
    padding:10px 13px;
    font-size:20px;
}

/* =========================================================
   HERO
   ========================================================= */

.hero{
    min-height:545px;
    position:relative;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 78% 45%,
            rgba(207,171,70,.18),
            transparent 23%
        ),
        linear-gradient(
            90deg,
            #123f34 0%,
            #073b30 52%,
            #052d25 100%
        );
    color:white;
}

.hero:before{
    content:"";
    position:absolute;
    inset:0;
    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(255,255,255,.08),
            transparent 20%
        ),
        radial-gradient(
            circle at 88% 25%,
            rgba(242,200,91,.10),
            transparent 20%
        );
}

.hero-content{
    max-width:1250px;
    min-height:545px;
    margin:auto;
    position:relative;
    z-index:2;
    display:grid;
    grid-template-columns:1fr 1.25fr 1fr;
    align-items:center;
    gap:20px;
    padding:45px 30px 25px;
}

/* الكتب في يسار الهيرو */

.books{
    align-self:end;
    position:relative;
    height:280px;
}

.book{
    position:absolute;
    left:0;
    width:245px;
    height:44px;
    border-radius:4px 10px 10px 4px;
    box-shadow:
        0 7px 10px rgba(0,0,0,.35),
        inset 0 0 0 2px rgba(255,255,255,.08);
}

.book:after{
    content:"";
    position:absolute;
    right:20px;
    top:8px;
    width:3px;
    height:27px;
    background:var(--gold);
}

.book:nth-child(1){
    bottom:25px;
    background:#111f2c;
    transform:rotate(-2deg);
}
.book:nth-child(2){
    bottom:67px;
    background:#263e48;
    transform:rotate(1deg);
}
.book:nth-child(3){
    bottom:109px;
    background:#142f39;
    transform:rotate(-1deg);
}
.book:nth-child(4){
    bottom:151px;
    background:#193f36;
    transform:rotate(2deg);
}

.open-book{
    position:absolute;
    bottom:-4px;
    left:0;
    width:370px;
    height:125px;
    background:
        linear-gradient(
            90deg,
            #e9dfc5,
            #fffaf0 47%,
            #cbbd9b 50%,
            #fffaf0 53%,
            #e9dfc5
        );
    border-radius:5px 5px 25px 25px;
    transform:perspective(500px) rotateX(18deg);
    box-shadow:0 12px 22px rgba(0,0,0,.30);
}

/* النص الرئيسي */

.hero-center{
    text-align:center;
}

.hero-small{
    color:var(--gold2);
    font-size:26px;
    font-weight:bold;
    margin-bottom:5px;
}

.gold-line{
    display:flex;
    align-items:center;
    gap:12px;
    justify-content:center;
    margin-bottom:5px;
}

.gold-line span{
    height:2px;
    width:90px;
    background:linear-gradient(
        90deg,
        transparent,
        var(--gold)
    );
}

.gold-line span:last-child{
    background:linear-gradient(
        90deg,
        var(--gold),
        transparent
    );
}

.hero-title{
    font-size:58px;
    line-height:1.15;
    font-weight:900;
    color:#fff;
    text-shadow:0 5px 15px rgba(0,0,0,.25);
}

.hero-slogan{
    color:var(--gold2);
    font-size:23px;
    font-weight:bold;
    margin:14px 0;
}

.hero-description{
    color:#f0f4f1;
    font-size:16px;
    line-height:2;
    max-width:650px;
    margin:auto;
}

.hero-buttons{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-top:24px;
    flex-wrap:wrap;
}

.hero-btn{
    border:1px solid white;
    padding:12px 25px;
    border-radius:30px;
    font-weight:bold;
    transition:.3s;
    display:flex;
    gap:8px;
    align-items:center;
}

.hero-btn.gold{
    background:linear-gradient(
        135deg,
        #e8bd52,
        #c89627
    );
    color:#14291f;
    border-color:#f7d77e;
}

.hero-btn.dark{
    background:rgba(0,0,0,.08);
    color:#fff;
}

.hero-btn:hover{
    transform:translateY(-3px);
}

/* شعار الغين الكبير */

.hero-logo{
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    min-height:380px;
}

.big-g{
    font-family:Georgia,serif;
    font-size:260px;
    line-height:.8;
    color:#071e19;
    text-shadow:
        0 0 0 #fff,
        5px 5px 0 rgba(230,193,87,.9),
        0 0 35px rgba(238,202,100,.35);
    position:relative;
    z-index:2;
}

.big-g:after{
    content:"✦";
    position:absolute;
    color:var(--gold);
    font-size:95px;
    right:-5px;
    bottom:-30px;
}

/* =========================================================
   البطاقات الرئيسية
   ========================================================= */

.quick-section{
    background:#f4f4f1;
    padding:30px 4%;
    position:relative;
    z-index:3;
}

.quick-grid{
    max-width:1180px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:16px;
}

.quick-card{
    background:#fff;
    min-height:170px;
    border:1px solid #e6e5df;
    border-radius:20px;
    padding:22px 15px;
    text-align:center;
    box-shadow:0 8px 25px rgba(0,0,0,.07);
    transition:.35s;
}

.quick-card:hover{
    transform:translateY(-8px);
    box-shadow:0 17px 35px rgba(0,0,0,.13);
    border-color:#dfc16d;
}

.quick-icon{
    width:65px;
    height:65px;
    margin:0 auto 10px;
    display:grid;
    place-items:center;
    font-size:38px;
}

.quick-card h3{
    font-size:18px;
    margin-bottom:7px;
    color:#092e27;
}

.quick-card p{
    color:var(--muted);
    font-size:12px;
    line-height:1.7;
}

.card-line{
    width:42px;
    height:2px;
    background:var(--gold);
    margin:12px auto 0;
}

/* =========================================================
   القسم العام
   ========================================================= */

.section{
    padding:65px 4%;
    position:relative;
}

.section.pattern{
    background:
        radial-gradient(
            circle,
            rgba(8,59,48,.035) 1px,
            transparent 1px
        );
    background-size:22px 22px;
}

.section-title{
    text-align:center;
    margin-bottom:35px;
}

.section-title h2{
    color:var(--green);
    font-size:36px;
    margin-bottom:8px;
}

.section-title p{
    color:#6e7e79;
}

.title-decoration{
    margin:13px auto 0;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    color:var(--gold);
    font-size:25px;
}

.title-decoration span{
    height:1px;
    width:70px;
    background:var(--gold);
}

/* =========================================================
   المراحل الدراسية
   ========================================================= */

.stages{
    max-width:1100px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:17px;
}

.stage{
    position:relative;
    overflow:hidden;
    min-height:125px;
    border-radius:20px;
    background:#fff;
    box-shadow:0 8px 25px rgba(0,0,0,.09);
    border:1px solid #ddd;
    transition:.35s;
}

.stage:hover{
    transform:translateY(-5px);
    box-shadow:0 15px 30px rgba(0,0,0,.14);
}

.stage-top{
    height:73px;
    background:
        linear-gradient(
            135deg,
            #075143,
            #06382f
        );
    color:var(--gold2);
    display:grid;
    place-items:center;
    font-size:35px;
}

.stage-bottom{
    height:63px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px 45px 10px 45px;
    position:relative;
}

.stage-bottom strong{
    color:#102f28;
    font-size:16px;
}

.stage-arrow{
    position:absolute;
    right:10px;
    width:31px;
    height:31px;
    border-radius:50%;
    background:linear-gradient(
        135deg,
        #e8be53,
        #c79627
    );
    display:grid;
    place-items:center;
    color:#16342b;
    font-weight:bold;
}

/* =========================================================
   شريط المزايا
   ========================================================= */

.features{
    max-width:1100px;
    margin:40px auto 0;
    border-radius:30px;
    background:
        linear-gradient(
            100deg,
            #06382f,
            #075343,
            #06382f
        );
    color:white;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    overflow:hidden;
    box-shadow:0 12px 35px rgba(0,0,0,.15);
}

.feature{
    text-align:center;
    padding:24px 15px;
    border-left:1px solid rgba(255,255,255,.25);
}

.feature:last-child{
    border-left:0;
}

.feature-icon{
    color:var(--gold2);
    font-size:30px;
    margin-bottom:6px;
}

.feature strong{
    display:block;
    font-size:16px;
    margin-bottom:6px;
}

.feature small{
    color:#dbe5e0;
}

/* =========================================================
   قسم المواد
   ========================================================= */

.materials{
    max-width:1100px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.material{
    background:#fff;
    border:1px solid var(--border);
    border-radius:20px;
    padding:25px;
    display:flex;
    align-items:center;
    gap:15px;
    transition:.3s;
    box-shadow:0 7px 22px rgba(0,0,0,.06);
}

.material:hover{
    transform:translateY(-5px);
    border-color:var(--gold);
}

.material-icon{
    width:58px;
    height:58px;
    flex:none;
    border-radius:16px;
    background:#edf4f1;
    display:grid;
    place-items:center;
    font-size:28px;
}

.material h3{
    color:var(--green);
    font-size:16px;
    margin-bottom:5px;
}

.material p{
    color:#71807c;
    font-size:12px;
}

/* =========================================================
   الضوابط
   ========================================================= */

.rules-area{
    max-width:1050px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.rule-card{
    background:white;
    padding:25px;
    border-radius:20px;
    border:1px solid #e6e4dc;
    box-shadow:0 8px 25px rgba(0,0,0,.06);
}

.rule-number{
    color:var(--gold);
    font-size:30px;
    font-weight:bold;
    margin-bottom:8px;
}

.rule-card h3{
    color:var(--green);
    margin-bottom:8px;
}

.rule-card p{
    color:#697873;
    font-size:13px;
    line-height:1.8;
}

/* =========================================================
   الدعوة النهائية
   ========================================================= */

.quote{
    max-width:900px;
    margin:0 auto;
    background:#e9ece7;
    border-radius:50px;
    padding:17px 25px;
    text-align:center;
    color:#163d34;
    font-size:18px;
    font-weight:bold;
    position:relative;
}

.quote span{
    color:var(--gold);
    margin:0 12px;
}

/* =========================================================
   FOOTER
   ========================================================= */

.footer{
    background:
        linear-gradient(
            150deg,
            #052d25,
            #063b30 55%,
            #021d18
        );
    color:#fff;
    padding:45px 4% 20px;
    position:relative;
    overflow:hidden;
}

.footer:before{
    content:"";
    position:absolute;
    top:-40px;
    left:-5%;
    width:110%;
    height:80px;
    background:#f7f7f4;
    border-radius:50%;
}

.footer-inner{
    max-width:1150px;
    margin:auto;
    position:relative;
    z-index:2;
}

.footer-main{
    display:grid;
    grid-template-columns:1.3fr 1fr 1fr;
    gap:40px;
    padding-top:30px;
}

.footer-brand h2{
    color:#fff;
    margin-bottom:8px;
}

.footer-brand p{
    color:#bdcec8;
    font-size:13px;
    line-height:1.8;
}

.footer h3{
    color:var(--gold2);
    margin-bottom:13px;
}

.footer-links{
    display:flex;
    flex-direction:column;
    gap:9px;
    color:#d6e0dc;
    font-size:13px;
}

.footer-links a:hover{
    color:var(--gold2);
}

.socials{
    display:flex;
    gap:10px;
    margin-top:18px;
}

.social{
    width:42px;
    height:42px;
    border:1px solid var(--gold);
    color:var(--gold2);
    border-radius:50%;
    display:grid;
    place-items:center;
    font-size:18px;
    transition:.3s;
}

.social:hover{
    background:var(--gold);
    color:#123;
}

.copyright{
    border-top:1px solid rgba(255,255,255,.14);
    margin-top:35px;
    padding-top:18px;
    text-align:center;
    color:#b8c9c3;
    font-size:12px;
}

.copyright strong{
    color:var(--gold2);
}

/* =========================================================
   زر العودة للأعلى
   ========================================================= */

.to-top{
    position:fixed;
    bottom:22px;
    left:22px;
    width:45px;
    height:45px;
    border:0;
    border-radius:50%;
    background:var(--gold);
    color:#123;
    font-size:20px;
    display:none;
    z-index:100;
    box-shadow:0 8px 20px rgba(0,0,0,.2);
}

.to-top.show{
    display:block;
}

/* =========================================================
   نافذة الدخول
   ========================================================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.60);
    display:none;
    place-items:center;
    z-index:200;
    padding:20px;
}

.modal.show{
    display:grid;
}

.modal-box{
    width:min(440px,100%);
    background:#fff;
    border-radius:25px;
    padding:30px;
    box-shadow:0 20px 70px rgba(0,0,0,.3);
    text-align:center;
    position:relative;
}

.close-modal{
    position:absolute;
    left:15px;
    top:13px;
    border:0;
    background:#f2f2f2;
    width:34px;
    height:34px;
    border-radius:50%;
    font-size:18px;
}

.modal-logo{
    font-size:65px;
    color:var(--green);
    font-family:Georgia,serif;
}

.modal-box h2{
    color:var(--green);
    margin-bottom:8px;
}

.modal-box p{
    color:#788580;
    font-size:13px;
    margin-bottom:20px;
}

.input{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:12px;
    margin-bottom:12px;
    outline:none;
    text-align:right;
    font-family:inherit;
}

.input:focus{
    border-color:var(--green);
}

.modal-submit{
    width:100%;
    padding:13px;
    border:0;
    border-radius:12px;
    background:var(--green);
    color:#fff;
    font-weight:bold;
}

/* =========================================================
   الجوال والآيباد
   ========================================================= */

@media(max-width:1100px){

    .nav-links{
        gap:2px;
    }

    .nav-link{
        padding:10px 9px;
        font-size:12px;
    }

    .hero-content{
        grid-template-columns:.7fr 1.4fr .7fr;
    }

    .hero-title{
        font-size:48px;
    }

    .big-g{
        font-size:200px;
    }

    .quick-grid{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:850px){

    .topbar{
        font-size:11px;
    }

    .navbar{
        min-height:68px;
    }

    .menu-btn{
        display:block;
    }

    .nav-links{
        display:none;
        position:absolute;
        top:68px;
        right:0;
        left:0;
        background:#fff;
        padding:12px;
        box-shadow:0 15px 25px rgba(0,0,0,.12);
        flex-direction:column;
        align-items:stretch;
    }

    .nav-links.open{
        display:flex;
    }

    .nav-link{
        text-align:center;
    }

    .hero-content{
        grid-template-columns:1fr;
        text-align:center;
        min-height:auto;
        padding-top:55px;
    }

    .hero{
        min-height:auto;
    }

    .hero-logo{
        order:-1;
        min-height:180px;
    }

    .big-g{
        font-size:155px;
    }

    .books{
        display:none;
    }

    .hero-title{
        font-size:43px;
    }

    .quick-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .stages{
        grid-template-columns:repeat(2,1fr);
    }

    .features{
        grid-template-columns:repeat(2,1fr);
    }

    .feature:nth-child(2){
        border-left:0;
    }

    .materials{
        grid-template-columns:repeat(2,1fr);
    }

    .rules-area{
